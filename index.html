<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plat • Dex</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        /* ... giữ nguyên tất cả style của bạn ... */
        /* Chỉ thêm phần làm nổi bật checkbox (tùy chọn) */
        .turnstile-box {
            background: rgba(10, 15, 30, 0.9);
            padding: 40px 30px;
            border-radius: 24px;
            border: 2px solid #00f0ff;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        /* ... phần còn lại giữ nguyên ... */
    </style>
</head>
<body>

    <!-- OVERLAY -->
    <div id="turnstile-overlay">
        <div class="turnstile-box">
            <h2>🔒 Xác minh truy cập</h2>
            <p>Vui lòng <strong>tích chọn</strong> ô bên dưới để xác minh bạn không phải robot</p>
            <!-- Không cần data-appearance, vì đã chọn Interaction-only trên Cloudflare -->
            <div class="cf-turnstile" 
                 data-sitekey="0x4AAAAAAEc9ewrv4yt_-nMA" 
                 data-callback="onTurnstileSuccess">
            </div>
        </div>
    </div>

    <!-- Nội dung trang -->
    <canvas id="matrix-canvas"></canvas>
    <div class="container">
        <!-- ... phần còn lại giữ nguyên ... -->
    </div>

    <script>
        // ... matrix script ...
        function onTurnstileSuccess(token) {
            document.getElementById('turnstile-overlay').classList.add('hidden');
            console.log('✅ Verified, token:', token);
        }
    </script>
</body>
</html>
