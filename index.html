<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plat • Dex</title>
    <style>
        :root {
            --border-cyan: #00f0ff;
            --text-main: #ffffff;
        }

        /* Đồng bộ phông chữ Times New Roman */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Times New Roman', Times, serif !important;
        }

        body {
            background-color: #000000;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* CANVAS MATRIX CODE BACKGROUND */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.4;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 25px 15px;
            flex: 1;
            position: relative;
            z-index: 1;
        }

        /* HEADER & KHUNG LIQUID GLASS MỜ DÀNH CHO PLAT • DEX */
        header {
            text-align: center;
            margin-bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* KHUNG LIQUID GLASS (KÍNH MỜ LỎNG) */
        .glass-box {
            position: relative;
            padding: 20px 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05); /* Lớp nền trong suốt nhẹ */
            backdrop-filter: blur(12px); /* Hiệu ứng làm mờ hậu cảnh (Glassmorphism) */
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 8px 32px 0 rgba(0, 240, 255, 0.25),
                inset 0 0 15px rgba(255, 255, 255, 0.1);
            display: inline-block;
            margin-bottom: 12px;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        /* VIỀN PHÁT SÁNG DẠNG LIQUID (LỎNG) CHO KHUNG */
        .glass-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,240,255,0.3) 0%, rgba(255,0,85,0.3) 50%, transparent 70%);
            animation: liquidRotate 6s linear infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes liquidRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .glass-box:hover {
            box-shadow: 
                0 12px 40px 0 rgba(0, 240, 255, 0.45),
                inset 0 0 25px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* TIÊU ĐỀ PLAT • DEX TO HƠN */
        .rainbow-3d-title {
            font-size: 2.8rem; /* Đã tăng kích thước chữ to hơn */
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            line-height: 1.1;
            
            background: linear-gradient(
                90deg, 
                #ff0055, #ff7300, #fffb00, #48ff00, #00ffd5, #002bfd, #7a00ff, #ff00c8, #ff0055
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            filter: drop-shadow(2px 2px 0px #000) 
                    drop-shadow(-1px -1px 0px #000)
                    drop-shadow(0px 0px 15px rgba(0, 240, 255, 0.8));

            animation: rainbowFlow 3s linear infinite, glowPulse 1.5s ease-in-out infinite alternate;
        }

        @keyframes rainbowFlow {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        @keyframes glowPulse {
            0% {
                filter: drop-shadow(2px 2px 0px #000) 
                        drop-shadow(0px 0px 10px rgba(255, 0, 128, 0.8));
            }
            100% {
                filter: drop-shadow(3px 3px 0px #000) 
                        drop-shadow(0px 0px 25px rgba(0, 240, 255, 1));
            }
        }

        header p {
            font-size: 1.1rem;
            color: #00f0ff;
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 5px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        /* DANH SÁCH BANNER */
        .banner-list {
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        .banner-item {
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
        }

        /* 1. KHUNG CHỮ BANNER (ĐỎ - ĐEN TỪ TRÁI SANG PHẢI) */
        .banner-title-box {
            width: 100%;
            background: linear-gradient(to right, #8b0000 0%, #3a0007 40%, #000000 100%);
            border: 1px solid #ff0055;
            border-left: 5px solid #ff0055;
            padding: 12px 15px;
            text-align: center;
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
            transition: all 0.3s ease;
        }

        .banner-title-box:hover {
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.8);
            border-color: #ff3377;
        }

        .banner-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.8);
        }

        /* 2. KHUNG DÀNH RIÊNG CHO ẢNH BANNER */
        .banner-img-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background-color: #020611;
            border: 2px solid var(--border-cyan);
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            transition: all 0.3s ease;
        }

        .banner-img-box:hover {
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
            transform: scale(1.01);
        }

        .banner-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .banner-img-box:hover img {
            transform: scale(1.05);
        }

        /* 3. KHUNG PHẦN XEM NGAY */
        .banner-action-box {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 5px;
        }

        /* Nút Xem Ngay */
        .btn-view {
            position: relative;
            background: linear-gradient(135deg, #ff0055 0%, #7a00ff 100%);
            color: #ffffff;
            padding: 10px 35px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
            transition: all 0.3s ease;
            display: inline-block;
            border: none;
            text-align: center;
        }

        .btn-view:hover {
            background: linear-gradient(135deg, #00f0ff 0%, #0044ff 100%);
            color: #000;
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(0, 240, 250, 0.8);
        }

        /* FOOTER & GOOGLE MAPS */
        footer {
            width: 100%;
            background: transparent;
            border-top: 2px solid var(--border-cyan);
            padding: 35px 20px;
            margin-top: 50px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .footer-info {
            max-width: 650px;
            margin: 0 auto;
        }

        .footer-info h3 {
            color: var(--border-cyan);
            margin-bottom: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .footer-info p {
            margin-bottom: 8px;
            color: #ffffff;
            font-size: 1.1rem;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.9);
        }

        .map-container {
            margin-top: 20px;
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--border-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        }

        .map-container iframe {
            width: 100%;
            height: 220px;
            border: 0;
            filter: invert(90%) hue-rotate(180deg) contrast(1.2);
        }

        /* NÚT TELEGRAM TRÒN */
        .telegram-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #00f0ff, #0044ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            transition: transform 0.3s, box-shadow 0.3s;
            z-index: 1000;
            border: 2px solid #ffffff;
        }

        .telegram-btn:hover {
            transform: scale(1.15) rotate(10deg);
            box-shadow: 0 0 30px rgba(0, 240, 255, 1);
        }

        .telegram-btn svg {
            width: 30px;
            height: 30px;
            fill: #ffffff;
            margin-right: 2px;
        }
    </style>
</head>
<body>

    <!-- Canvas Matrix phủ toàn bộ màn hình -->
    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="glass-box">
                <h1 class="rainbow-3d-title">Plat • Dex</h1>
            </div>
            <p>Nơi Các Siêu Nhân Đẻ Ra</p>
        </header>

        <!-- Danh sách Banner -->
        <main class="banner-list">
            
            <!-- Banner 1 -->
            <div class="banner-item">
                <div class="banner-title-box">
                    <span class="banner-title">1. Hack Liên Quân IOS Miễn Phí</span>
                </div>
                <div class="banner-img-box">
                    <img src="LQ.PNG" alt="Liên Quân IOS Miễn Phí">
                </div>
                <div class="banner-action-box">
                    <a href="#" class="btn-view">Xem Ngay</a>
                </div>
            </div>

            <!-- Banner 2 -->
            <div class="banner-item">
                <div class="banner-title-box">
                    <span class="banner-title">2. Hack Free Fire IOS Miễn Phí</span>
                </div>
                <div class="banner-img-box">
                    <img src="FF.PNG" alt="Free Fire IOS Miễn Phí">
                </div>
                <div class="banner-action-box">
                    <a href="#" class="btn-view">Xem Ngay</a>
                </div>
            </div>

            <!-- Banner 3 -->
            <div class="banner-item">
                <div class="banner-title-box">
                    <span class="banner-title">3. Hack Play Together IOS Miễn Phí</span>
                </div>
                <div class="banner-img-box">
                    <img src="PLT.PNG" alt="Play Together IOS Miễn Phí">
                </div>
                <div class="banner-action-box">
                    <a href="#" class="btn-view">Xem Ngay</a>
                </div>
            </div>

            <!-- Banner 4 -->
            <div class="banner-item">
                <div class="banner-title-box">
                    <span class="banner-title">4. Tải Và Hướng Dẫn Cài TFT Pbe IOS Miễn Phí</span>
                </div>
                <div class="banner-img-box">
                    <img src="TFTPBE.PNG" alt="Tải Và Hướng Dẫn Cài TFT Pbe IOS Miễn Phí">
                </div>
                <div class="banner-action-box">
                    <a href="#" class="btn-view">Xem Ngay</a>
                </div>
            </div>

        </main>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-info">
            <h3>THÔNG TIN CHỦ SỞ HỮU</h3>
            <p><strong>Developer:</strong> Plat • Dex</p>
            <p><strong>Địa Chỉ:</strong> Hà Nội , Việt Nam</p>
            
            <div class="map-container">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d476859.1023737525!2d105.37248386807498!3d20.97344611400609!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3135ab9bd9861ca1%3A0x3233d6118b3cb358!2zSMOgIE7hu5lpLCBWaeG7h3QgTmFt!5e0!3m2!1svi!2s!4v1700000000000!5m2!1svi!2s" 
                    allowfullscreen="" 
                    loading="lazy">
                </iframe>
            </div>
        </div>
    </footer>

    <!-- Icon Telegram -->
    <a href="https://t.me/your_telegram" class="telegram-btn" target="_blank" aria-label="Telegram">
        <svg viewBox="0 0 24 24">
            <path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.16l-2.01 9.48c-.15.68-.55.84-1.12.52l-3.1-2.28-1.5 1.44c-.17.17-.31.31-.63.31l.22-3.17 5.77-5.21c.25-.22-.05-.34-.39-.12l-7.13 4.49-3.07-.96c-.67-.21-.68-.67.14-.99l12.01-4.63c.56-.21 1.05.13.83.92z"/>
        </svg>
    </a>

    <!-- SCRIPT MATRIX CODE -->
    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ<>/{}[];:*&^%$#@!';
        const fontSize = 14;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = Array(columns).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00f0ff';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 33);
    </script>
</body>
</html>
