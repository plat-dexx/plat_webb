<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plat • Dex</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        /* ... toàn bộ style giữ nguyên như bạn đã có ... */
        /* chỉ thêm dòng này để chắc chắn overlay không bị ẩn nếu chưa xác minh */
        #turnstile-overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <!-- OVERLAY TURNSTILE -->
    <div id="turnstile-overlay">
        <div class="turnstile-box">
            <h2>🔒 Xác minh truy cập</h2>
            <p>Vui lòng tích chọn <strong>"Tôi không phải robot"</strong> để tiếp tục</p>
            <!-- Thêm data-appearance="interaction-only" để luôn hiện checkbox -->
            <div class="cf-turnstile" 
                 data-sitekey="0x4AAAAAAEc9ewrv4yt_-nMA" 
                 data-callback="onTurnstileSuccess"
                 data-appearance="interaction-only">
            </div>
        </div>
    </div>

    <!-- Phần còn lại của trang giữ nguyên -->
    <canvas id="matrix-canvas"></canvas>
    <div class="container">
        <!-- ... nội dung của bạn ... -->
    </div>
    <!-- ... footer, telegram button ... -->

    <script>
        // ... toàn bộ script matrix background giữ nguyên ...

        // Hàm callback khi người dùng tích chọn thành công
        function onTurnstileSuccess(token) {
            document.getElementById('turnstile-overlay').classList.add('hidden');
            console.log('✅ Verified, token:', token);
        }
    </script>
</body>
</html>
