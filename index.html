<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plat • Dex</title>
    <style>
        :root {
            --bg-main: #030712;
            --bg-card: #0b132b;
            --border-cyan: #00f0ff;
            --text-main: #ffffff;
        }

        /* Đồng bộ phông chữ Times New Roman */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Times New Roman', Times, serif !important;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(0, 240, 255, 0.12) 0%, transparent 60%),
                linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 25px 25px, 25px 25px;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 25px 15px;
            flex: 1;
        }

        /* HEADER & CHỮ 3D NHẤP NHÁY MÀU CẦU VỒNG */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .rainbow-3d-title {
            font-size: 2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            
            background: linear-gradient(
                90deg, 
                #ff0055, #ff7300, #fffb00, #48ff00, #00ffd5, #002bfd, #7a00ff, #ff00c8, #ff0055
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            filter: drop-shadow(2px 2px 0px #000) 
                    drop-shadow(-1px -1px 0px #000)
                    drop-shadow(0px 0px 15px rgba(0, 240, 255, 0.6));

            animation: rainbowFlow 3s linear infinite, glowPulse 1.5s ease-in-out infinite alternate;
        }

        @keyframes rainbowFlow {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        @keyframes glowPulse {
            0% {
                filter: drop-shadow(2px 2px 0px #000) 
                        drop-shadow(0px 0px 10px rgba(255, 0, 128, 0.8));
            }
            100% {
                filter: drop-shadow(3px 3px 0px #000) 
                        drop-shadow(0px 0px 25px rgba(0, 240, 255, 1));
            }
        }

        header p {
            font-size: 1.1rem;
            color: #00f0ff;
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 5px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        /* BANNER CARD GÓC CẠNH HẦM HỐ */
        .banner-list {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .banner-card {
            background: var(--bg-card);
            position: relative;
            padding: 15px;
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
            border: 2px solid rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center; /* Căn giữa các thành phần con */
        }

        .banner-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 8px;
            height: 100%;
            background: var(--border-cyan);
            box-shadow: 0 0 10px var(--border-cyan);
        }

        .banner-card:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: var(--border-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        /* Tiêu đề banner nằm TRÊN CÙNG và CĂN GIỮA */
        .banner-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 12px;
            text-align: center;
            width: 100%;
            padding: 5px 0;
            border-bottom: 2px solid #ff0055;
            text-transform: uppercase;
        }

        /* KHUNG ẢNH 16:9 */
        .banner-img-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background-color: #020611;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
        }

        .banner-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .banner-card:hover .banner-img-container img {
            transform: scale(1.05);
        }

        /* Khung chứa nút Xem Ngay CĂN GIỮA */
        .banner-actions {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 5px;
        }

        /* Nút Xem Ngay nằm giữa */
        .btn-view {
            position: relative;
            background: linear-gradient(135deg, #ff0055 0%, #7a00ff 100%);
            color: #ffffff;
            padding: 10px 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
            transition: all 0.3s ease;
            display: inline-block;
            border: none;
            text-align: center;
        }

        .btn-view:hover {
            background: linear-gradient(135deg, #00f0ff 0%, #0044ff 100%);
            color: #000;
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(0, 240, 250, 0.8);
        }

        /* FOOTER & GOOGLE MAPS */
        footer {
            width: 100%;
            background: #01040a;
            border-top: 2px solid var(--border-cyan);
            padding: 35px 20px;
            margin-top: 50px;
            text-align: center;
        }

        .footer-info {
            max-width: 650px;
            margin: 0 auto;
        }

        .footer-info h3 {
            color: var(--border-cyan);
            margin-bottom: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .footer-info p {
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .map-container {
            margin-top: 20px;
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--border-cyan);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.9);
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        }

        .map-container iframe {
            width: 100%;
            height: 220px;
            border: 0;
            filter: invert(90%) hue-rotate(180deg) contrast(1.2);
        }

        /* NÚT TELEGRAM TRÒN */
        .telegram-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #00f0ff, #0044ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            transition: transform 0.3s, box-shadow 0.3s;
            z-index: 1000;
            border: 2px solid #ffffff;
        }

        .telegram-btn:hover {
            transform: scale(1.15) rotate(10deg);
            box-shadow: 0 0 30px rgba(0, 240, 255, 1);
        }

        .telegram-btn svg {
            width: 30px;
            height: 30px;
            fill: #ffffff;
            margin-right: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1 class="rainbow-3d-title">Plat • Dex</h1>
            <p>Nơi Các Siêu Nhân Đẻ Ra</p>

        <!-- Danh sách Banner -->
        <main class="banner-list">

    <!-- Footer & Thông tin liên hệ -->
    <footer>
        <div class="footer-info">
            <h3>THÔNG TIN LIÊN HỆ</h3>
            <p><strong>Developer:</strong> Plat • Dex</p>
            <p><strong>Địa Chỉ:</strong> Hà Nội , Việt Nam</p>
            
            <div class="map-container">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d476859.1023737525!2d105.37248386807498!3d20.97344611400609!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3135ab9bd9861ca1%3A0x3233d6118b3cb358!2zSMOgIE7hu5lpLCBWaeG7h3QgTmFt!5e0!3m2!1svi!2s!4v1700000000000!5m2!1svi!2s"

    <!-- Icon Telegram Tròn -->

</body>
